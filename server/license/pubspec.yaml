name: goabacus_license
description: GoAbacUs licence server. Redeems kit codes and store purchases and signs family licences (Ed25519).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  googleapis: ^14.0.0
  googleapis_auth: ^2.0.0
  http: ^1.2.0
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  tutor_tasks:
    path: ../../packages/tutor_tasks

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
