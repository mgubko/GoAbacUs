name: Tutor apps

# GoAbacUs Scan (parent), GoAbacUs Tutor (child) and the Camera Lab. The GoAbacUs abacus
# app itself is built by android.yml / ios.yml and is not touched here.
on:
  push:
    branches: ['**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/tutor-apps.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/tutor-apps.yml'
  workflow_dispatch:

concurrency:
  group: tutor-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: tutor_tasks (tasks, QR packets, offline page parser)
        working-directory: packages/tutor_tasks
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: tutor_vision (camera: sheet markers, rods, abacus, touches)
        working-directory: packages/tutor_vision
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: abacus_kit (physics, sound, example player)
        working-directory: packages/abacus_kit
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Tutor app (child)
        working-directory: apps/tutor
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Scan app (parent)
        working-directory: apps/scan
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Camera Lab
        working-directory: apps/camlab
        run: |
          flutter pub get
          flutter analyze
          flutter test

  apk:
    name: Debug APK (${{ matrix.app }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [scan, tutor, camlab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: apps/${{ matrix.app }}
        run: |
          flutter pub get
          flutter build apk --debug --build-number=${{ github.run_number }}
      - name: The tutor asks for no internet permission
        if: matrix.app == 'tutor'
        working-directory: apps/tutor
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          m=$(find build -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $m"
          if grep -q 'android.permission.INTERNET' "$m"; then
            echo "::error::The release tutor app must not request INTERNET"; exit 1
          fi
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/goabacus-tutor-release-debugsigned.apk
      - name: Camera Lab release build (recognition in debug mode is ~10x slower)
        if: matrix.app == 'camlab'
        working-directory: apps/camlab
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/goabacus-camlab-release-debugsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: goabacus-${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
